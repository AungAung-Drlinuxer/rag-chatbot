# Gitea on drlinuxer-prod — self-hosted git for the ragchatbot workspace.
# ns: gitea · git.drlinuxer.com (nginx ingress, TLS via cert-manager/letsencrypt as siblings)
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-postgres
  namespace: gitea
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-postgres
  namespace: gitea
type: Opaque
stringData:
  POSTGRES_DB: gitea
  POSTGRES_USER: gitea
  POSTGRES_PASSWORD: "CHANGE_ME_BEFORE_APPLY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-postgres
  namespace: gitea
spec:
  replicas: 1
  selector: { matchLabels: { app: gitea-postgres } }
  template:
    metadata: { labels: { app: gitea-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom: [{ secretRef: { name: gitea-postgres } }]
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gitea-postgres }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-postgres
  namespace: gitea
spec:
  selector: { app: gitea-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  selector: { matchLabels: { app: gitea } }
  template:
    metadata: { labels: { app: gitea } }
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.22
          env:
            - { name: USER, value: git }
            - { name: GITEA__database__DB_TYPE, value: postgres }
            - { name: GITEA__database__HOST, value: gitea-postgres:5432 }
            - { name: GITEA__database__NAME, value: gitea }
            - { name: GITEA__database__USER, value: gitea }
            - { name: GITEA__database__PASSWD, valueFrom: { secretKeyRef: { name: gitea-postgres, key: POSTGRES_PASSWORD } } }
            - { name: GITEA__server__DOMAIN, value: git.drlinuxer.com }
            - { name: GITEA__server__ROOT_URL, value: "https://git.drlinuxer.com" }
            - { name: GITEA__server__SSH_DOMAIN, value: git.drlinuxer.com }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            # single admin — created on first start; CHANGE the password after
            - { name: GITEA__admin__USERNAME, value: ithadmin }
            - { name: GITEA__admin__PASSWORD, valueFrom: { secretKeyRef: { name: gitea-admin, key: password } } }
            - { name: GITEA__admin__EMAIL, value: aungaungmyomyint@drlinuxer.com }
          ports:
            - { containerPort: 3000, name: http }
            - { containerPort: 22, name: ssh }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gitea-data }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector: { app: gitea }
  ports:
    - { name: http, port: 80, targetPort: 3000 }
    - { name: ssh, port: 22, targetPort: 22 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: gitea
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"   # git pushes / LFS
spec:
  ingressClassName: nginx
  rules:
    - host: git.drlinuxer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port: { number: 80 }
