# Gitea act_runner on RKE2 — spawns CI job pods in-cluster.
# Requires secret `act-runner-token` (see CI-SETUP.md step 1).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: act-runner
  namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: act-runner
  namespace: gitea
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: act-runner
  namespace: gitea
subjects:
  - kind: ServiceAccount
    name: act-runner
    namespace: gitea
roleRef:
  kind: Role
  name: act-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: act-runner-token
  namespace: gitea
type: Opaque
stringData:
  token: "PASTE_REGISTRATION_TOKEN_HERE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: gitea
spec:
  replicas: 1
  selector: { matchLabels: { app: act-runner } }
  template:
    metadata: { labels: { app: act-runner } }
    spec:
      serviceAccountName: act-runner
      containers:
        - name: runner
          image: gitea/act_runner:0.2
          command: [sh, -c]
          args:
            - |
              act_runner register --no-interactive \
                --instance http://gitea.gitea.svc.cluster.local:3000 \
                --token "$REGISTRATION_TOKEN" \
                --name "rke2-runner" \
                --labels "ubuntu-latest:docker://node:22-bookworm" || true
              act_runner daemon
          env:
            - name: REGISTRATION_TOKEN
              valueFrom: { secretKeyRef: { name: act-runner-token, key: token } }
            - name: GITEA_INSTANCE_URL
              value: http://gitea.gitea.svc.cluster.local:3000
            - name: CONFIG_FILE
              value: ""
          volumeMounts:
            - { name: work, mountPath: /workspace }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: work
          emptyDir: {}
