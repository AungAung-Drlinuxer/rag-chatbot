# === rag-chatbot — Rerank service (FastAPI / BAAI bge-reranker-base) ======
# Pairs with the retrieval pipeline to improve top-N precision.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rerank-svc
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: rerank-svc
    app.kubernetes.io/component: ai-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rerank-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rerank-svc
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: rerank
          image: harbor.drlinuxer.com/rag-chatbot/rerank-svc:1.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: RERANK_MODEL
              value: "BAAI/bge-reranker-base"
            - name: RERANK_DEVICE
              value: "cpu"
            - name: RERANK_MAX_CANDIDATES
              value: "50"
            - name: RERANK_TIMEOUT
              value: "30"
            # Optional shared-secret auth header; backend sets same header.
            - name: RERANK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: rerank-api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          # v1.6.50 — the LIVE deployment had drifted from this manifest: it was
          # running requests cpu=200m / memory=800Mi and limits 2/3Gi, i.e. 40% of
          # the CPU committed here, on a service that is entirely CPU-bound. Along
          # with an 8s client budget against a 27s batch, that is why every rerank
          # call timed out and the answer silently degraded to raw vector order.
          resources:
            requests: { cpu: "500m", memory: 2Gi }
            limits:   { cpu: "2",    memory: 4Gi }
          # v1.6.50 — a startupProbe. Without one, a cold start is judged by the
          # LIVENESS probe, so a slow model load can be killed mid-way and restarted,
          # repeating the cycle. 30 x 5s = 150s of grace, and liveness/readiness stay
          # parked until it passes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 2
          # /health returns 503 until the model is resident (fixed in 1.0.2). The
          # probes only read the status code, so previously a pod that was still
          # loading was marked READY and given traffic — the first request then paid
          # the lazy model load and the caller timed out.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rerank-svc
  namespace: rag-chatbot
spec:
  selector:
    app.kubernetes.io/name: rerank-svc
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rerank-svc
  namespace: rag-chatbot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rerank-svc
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
