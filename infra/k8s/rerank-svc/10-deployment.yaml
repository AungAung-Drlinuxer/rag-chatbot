# === it-help-chatbot — Rerank service (FastAPI / BAAI bge-reranker-base) ======
# Pairs with the retrieval pipeline to improve top-N precision.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rerank-svc
  namespace: it-help-chatbot
  labels:
    app.kubernetes.io/name: rerank-svc
    app.kubernetes.io/component: ai-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rerank-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rerank-svc
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: rerank
          image: harbor.drlinuxer.com/ragchatbot/rerank-svc:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RERANK_MODEL
              value: "BAAI/bge-reranker-base"
            - name: RERANK_DEVICE
              value: "cpu"
            - name: RERANK_MAX_CANDIDATES
              value: "50"
            - name: RERANK_TIMEOUT
              value: "30"
            # Optional shared-secret auth header; backend sets same header.
            - name: RERANK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: rerank-api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: "500m", memory: 2Gi }
            limits:   { cpu: "2",    memory: 4Gi }
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rerank-svc
  namespace: it-help-chatbot
spec:
  selector:
    app.kubernetes.io/name: rerank-svc
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rerank-svc
  namespace: it-help-chatbot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rerank-svc
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
