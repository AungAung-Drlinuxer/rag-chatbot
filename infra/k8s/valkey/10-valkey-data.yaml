# === rag-chatbot — Valkey 9.1 (Sentinel HA: 3 primaries + 3 sentinels) ======
# PRE-WRITTEN for a future migration from redis:7.4 — do NOT apply while the
# redis-* stack is live (resource names are distinct so both can coexist, but
# see README.md for the cutover plan).
#
# Topology (mirrors infra/k8s/redis/):
#   valkey-data    (StatefulSet, 3 replicas)  — AOF + everysec fsync
#   valkey-sentinel(StatefulSet, 3 replicas)  — monitors and elects a master
# Application talks to `valkey-service` (Sentinel-aware) for the master and
# `valkey-data-headless` for direct pod DNS during failover.
#
# Image: valkey/valkey:9.1.2 (binaries: valkey-server / valkey-cli;
#        valkey-sentinel is a symlink to valkey-server)
# NOTE: valkey image runs user valkey uid=999 gid=1000 (fsGroup below).

apiVersion: v1
kind: Secret
metadata:
  name: valkey-pass
  namespace: rag-chatbot
type: Opaque
stringData:
  # ACL user 'app' used by the chat backend
  password: __REPLACE_WITH_RANDOM_32_BYTES__
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
  namespace: rag-chatbot
data:
  valkey.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    supervised no
    daemonize no

    # Replication / persistence
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-min-size 64mb
    auto-aof-rewrite-percentage 100

    # Memory & eviction
    maxmemory 1gb
    maxmemory-policy allkeys-lru

    # ACL (requirepass is set in command-line overlay, this is the user 'app')
    aclfile /etc/valkey/users.acl

    # Slowlog for performance diagnostics
    slowlog-log-slower-than 10000
    slowlog-max-len 128

    # Network
    tcp-keepalive 60
    timeout 0
  sentinel.conf: |
    bind 0.0.0.0
    port 26379
    supervised no
    daemonize no
    requirepass __REPLACE_WITH_RANDOM_32_BYTES__
    masterauth __REPLACE_WITH_RANDOM_32_BYTES__

    # Master set — three sentinels, 2 votes = quorum
    sentinel monitor rag-chatbot-valkey valkey-data-0.valkey-data-headless.rag-chatbot.svc.cluster.local 6379 2
    sentinel down-after-milliseconds rag-chatbot-valkey 5000
    sentinel failover-timeout rag-chatbot-valkey 60000
    sentinel parallel-syncs rag-chatbot-valkey 1
    sentinel resolve-hostnames yes
    sentinel auth-pass rag-chatbot-valkey __REPLACE_WITH_RANDOM_32_BYTES__
  users.acl: |
    user default off
    user app on >__REPLACE_WITH_RANDOM_32_BYTES__ ~* &* +@all
    user sentinel on >__REPLACE_WITH_RANDOM_32_BYTES__ +@all -@dangerous
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-data
  namespace: rag-chatbot
spec:
  serviceName: valkey-data-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/component: data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: data
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: valkey
                    app.kubernetes.io/component: data
      securityContext:
        # valkey container: uid 999, gid 1000 (per valkey-container Dockerfile)
        fsGroup: 1000
      initContainers:
        - name: init-config
          image: valkey/valkey:9.1.2
          command: ["/bin/sh","-c"]
          args:
            - |
              # The first replica (index 0) is the bootstrap master, the others
              # come up as replicas pointed at it via DNS.
              if [ "$(hostname | rev | cut -d- -f1 | rev)" = "0" ]; then
                cp /readonly/valkey.conf /conf/valkey.conf
              else
                cp /readonly/valkey.conf /conf/valkey.conf
                echo "replicaof valkey-data-0.valkey-data-headless.rag-chatbot.svc.cluster.local 6379" >> /conf/valkey.conf
              fi
          volumeMounts:
            - { name: conf,        mountPath: /conf }
            - { name: conf-readonly, mountPath: /readonly }
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2
          imagePullPolicy: IfNotPresent
          command: ["valkey-server","/conf/valkey.conf","--aclfile","/etc/valkey/users.acl","--requirepass","__REPLACE_WITH_RANDOM_32_BYTES__","--masterauth","__REPLACE_WITH_RANDOM_32_BYTES__","--replica-announce-ip","$(POD_IP)"]
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
          ports:
            - name: client
              containerPort: 6379
          volumeMounts:
            - { name: data,   mountPath: /data }
            - { name: conf,   mountPath: /conf }
            - { name: acl,    mountPath: /etc/valkey }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: "1",   memory: 2Gi }
          livenessProbe:
            exec:
              command: ["valkey-cli","-a","__REPLACE_WITH_RANDOM_32_BYTES__","-p","6379","ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: conf-readonly
          configMap:
            name: valkey-config
            items: [{ key: valkey.conf, path: valkey.conf }]
        - name: acl
          configMap:
            name: valkey-config
            items: [{ key: users.acl,  path: users.acl }]
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-iscsi
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-data-headless
  namespace: rag-chatbot
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: data
  ports:
    - name: client
      port: 6379
      targetPort: client
