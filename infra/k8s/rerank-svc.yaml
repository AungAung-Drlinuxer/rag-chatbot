apiVersion: apps/v1
kind: Deployment
metadata:
  name: rerank-svc
  namespace: it-help-chatbot
  labels: { app: rerank-svc }
spec:
  replicas: 2                      # HA: backend falls back to vector order if both down
  selector:
    matchLabels: { app: rerank-svc }
  template:
    metadata:
      labels: { app: rerank-svc }
    spec:
      containers:
        - name: rerank-svc
          image: harbor.drlinuxer.com/it-help-chatbot/rerank-svc:1.0.0
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          env:
            - name: RERANK_MODEL
              value: BAAI/bge-reranker-base
            - name: RERANK_MAX_DOCS
              value: "32"
            - name: RERANK_API_KEY            # optional in-cluster shared secret
              valueFrom:
                secretKeyRef: { name: rerank-svc-secrets, key: api_key, optional: true }
          resources:
            requests: { cpu: 500m, memory: 1536Mi }   # torch + 57M-param model in RAM
            limits:   { cpu: "2",  memory: 2Gi }      # OMP pinned to 2 threads (v0.21.54 lesson)
          readinessProbe:
            httpGet: { path: /health, port: 8080 }    # green only after model is resident
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 60                   # cold model load ~5-15s, be generous
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rerank-svc
  namespace: it-help-chatbot
  labels: { app: rerank-svc }
spec:
  selector: { app: rerank-svc }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rerank-svc
  namespace: it-help-chatbot
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rerank-svc }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
