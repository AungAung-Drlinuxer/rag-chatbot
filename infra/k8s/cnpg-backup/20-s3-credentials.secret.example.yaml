---
# S3 credentials for CNPG backups (Option C — external object store).
#
# DO NOT COMMIT REAL VALUES. Create the Secret with kubectl instead:
#
#   kubectl -n rag-chatbot create secret generic cnpg-backup-s3 \
#     --from-literal=ACCESS_KEY_ID='...' \
#     --from-literal=SECRET_ACCESS_KEY='...' \
#     --from-literal=REGION='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# This file exists so the required key names are explicit, not so it can be applied.
#
# WHY A SECRET AND NOT SETTINGS: the ObjectStore CR reads these by reference and CNPG
# mounts them into the barman-cloud sidecar for archive/restore commands. They never
# transit the application, its API or its logs.
#
# Minimum policy the access key needs on the bucket (nothing more):
#   s3:GetObject  s3:PutObject  s3:DeleteObject  s3:ListBucket
# Scope it to the one prefix, e.g. arn:aws:s3:::my-bucket/cnpg/* — a backup credential
# should not be able to touch anything else in the account.
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-backup-s3
  namespace: rag-chatbot
type: Opaque
stringData:
  ACCESS_KEY_ID: REPLACE_ME
  SECRET_ACCESS_KEY: REPLACE_ME
  REGION: REPLACE_ME
