---
# ObjectStore — Garage (self-hosted S3) at https://s3.drlinuxer.com
#
# VERIFIED AGAINST THE LIVE ENDPOINT BEFORE WRITING THIS
#   dns              s3.drlinuxer.com -> 10.10.10.16, reachable from a pod
#   TLS              ssl_verify_result=0 (valid public chain — no endpointCA needed)
#   GET /            403 with body:
#                    <Error><Code>AccessDenied</Code><Message>Forbidden: Garage does not
#                    support anonymous access yet</Message><Region>garage</Region></Error>
#   GET /production-backups  403 (path-style reached the bucket namespace, not a 404)
#
# Three things come straight out of that response and each one alone breaks the backup:
#
#  1. REGION IS `garage`, not us-east-1. Garage reports its region in the error XML, boto3
#     signs every request with it, and a mismatch gives SignatureDoesNotMatch.
#
#  2. CHECKSUM HEADERS. Recent boto3 enables AWS S3 data-integrity protections that Garage
#     does not implement, producing an x-amz-content-sha256 error on upload — a known
#     incompatibility with S3-compatible stores (plugin-barman-cloud issue #393, in the
#     plugin's own object-store docs). The two env vars below restore the old behaviour.
#     Without them the first backup fails in a way that looks like bad credentials.
#
#  3. PATH-STYLE. Garage serves buckets at /<bucket>, not <bucket>.host. barman-cloud uses
#     path-style automatically whenever endpointURL is set — which is why upstream labels
#     their DigitalOcean Spaces example "(SFO3, path-style)" with no extra flag to set.
#     The 403 above rather than a 404 confirms the request reached the bucket namespace.
#
# endpointURL must NOT include the bucket: the bucket lives in destinationPath.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup-store
  namespace: rag-chatbot
spec:
  # How far back a point-in-time restore can reach.
  retentionPolicy: "14d"

  instanceSidecarConfiguration:
    env:
      # See note 2. This is the difference between a working backup and a cryptic checksum
      # error on an S3-compatible store.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

  configuration:
    destinationPath: "s3://production-backups/rag-chatbot-postgres"
    endpointURL: "https://s3.drlinuxer.com"
    wal:
      compression: gzip
    data:
      compression: gzip
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: SECRET_ACCESS_KEY
      region:
        name: cnpg-backup-s3
        key: REGION          # the Secret's REGION value must be exactly: garage
