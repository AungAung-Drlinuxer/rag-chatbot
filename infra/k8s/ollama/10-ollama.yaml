# === it-help-chatbot — Ollama (local CPU LLM / embeddings runtime) ===========
# Air-gapped: model pre-baked into the image at build-time (no runtime pulls).
# Models: nomic-embed-text (embeddings), llama3.2:1b (fallback chat).
# Pulls from Harbor `platform/ollama:<tag>` — do NOT use the upstream ollama
# image with `ollama pull` since clusters are air-gapped.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: it-help-chatbot
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: ai-runtime
spec:
  replicas: 1   # Stateful — leader for in-memory model cache
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: ollama
          image: harbor.drlinuxer.com/platform/ollama:0.5.7-models   # models baked in
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_MODELS
              value: /models
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests: { cpu: "1",   memory: 4Gi }
            limits:   { cpu: "8",   memory: 16Gi }
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: embedding-models-pvc   # preloaded with nomic-embed-text
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedding-models-pvc
  namespace: it-help-chatbot
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi
  storageClassName: truenas-iscsi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: it-help-chatbot
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
