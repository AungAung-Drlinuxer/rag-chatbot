---
# Grafana MCP — read-only, SSE transport, in-cluster.
#
# WHY NO BRIDGE (unlike Proxmox)
# grafana/mcp-grafana is a Go server that already speaks HTTP: its image entrypoint is
# `/app/mcp-grafana --transport sse --address 0.0.0.0:8000`. Nothing needs to wrap it.
#
# SAFETY POSTURE
#   --disable-write   the upstream read-only gate: "Disable write tools (create/update
#                     operations)". Pinned on, so no dashboard/alert/datasource can be
#                     changed from the assistant even if a tool name changes upstream.
#   --allowed-hosts   the HTTP transports validate the Host header and default to loopback
#                     variants of --address, which would reject in-cluster traffic
#                     addressed as grafana-mcp:8000. "*" is correct HERE only because the
#                     Service is ClusterIP and nothing outside the cluster can reach it.
#
# NO GRAFANA TOKEN IN THIS MANIFEST, ON PURPOSE
# The Grafana service-account token is supplied PER REQUEST as the connector's bearer
# token and forwarded upstream, exactly like the Rancher management token. That keeps the
# credential out of the cluster manifest, lets a Rancher/Grafana role decide what is
# visible, and means revoking it is a Grafana-side action with no redeploy.
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-mcp
  ports:
    - name: sse
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: harbor.drlinuxer.com/rag-chatbot/grafana-mcp:latest
          args:
            - --transport
            - sse
            - --address
            - 0.0.0.0:8000
            - --disable-write
            - --allowed-hosts
            - "*"
            - --log-level
            - info
          env:
            - name: GRAFANA_URL
              value: "http://10.10.10.18:3000"
          ports:
            - name: sse
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
