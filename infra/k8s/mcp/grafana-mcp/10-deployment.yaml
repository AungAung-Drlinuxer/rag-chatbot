---
# Grafana MCP — read-only, SSE transport, in-cluster.
#
# WHY NO BRIDGE (unlike Proxmox)
# grafana/mcp-grafana is a Go server that already speaks HTTP: its image entrypoint is
# `/app/mcp-grafana --transport sse --address 0.0.0.0:8000`. Nothing needs to wrap it.
#
# SAFETY POSTURE
#   --disable-write   the upstream read-only gate: "Disable write tools (create/update
#                     operations)". Pinned on, so no dashboard/alert/datasource can be
#                     changed from the assistant even if a tool name changes upstream.
#   --allowed-hosts   the HTTP transports validate the Host header and default to loopback
#                     variants of --address, which would reject in-cluster traffic
#                     addressed as grafana-mcp:8000. "*" is correct HERE only because the
#                     Service is ClusterIP and nothing outside the cluster can reach it.
#
# NO GRAFANA TOKEN IN THIS MANIFEST, ON PURPOSE — but NOT for the reason first assumed.
#
# The original design supplied the Grafana service-account token PER REQUEST as the
# connector's bearer token, on the assumption that mcp-grafana forwards the caller's
# Authorization header upstream like the Rancher management server does. **It does not.**
# Measured against this build: `--help` offers no header-forwarding option and no
# `--grafana-token`; the only Grafana credential inputs are environment variables
# (GRAFANA_URL + GRAFANA_SERVICE_ACCOUNT_TOKEN). So a token pasted into Settings arrived at
# the backend, was attached to the request, and was then ignored — every tool answered
# `401 getDataSourcesUnauthorized` with a perfectly valid token sitting unused.
#
# The credential therefore comes from a Secret, like every other one in this estate:
#   kubectl -n rag-chatbot create secret generic grafana-mcp-credentials \
#     --from-literal=GRAFANA_SERVICE_ACCOUNT_TOKEN='glsa_...'
#
# TRADE-OFF, stated plainly: one service account means every user queries Grafana as that
# one identity, so Grafana-side per-user RBAC is not enforced. Reach it through Grafana's
# folder/datasource permissions on the service account, or run a header-forwarding build
# and go back to per-request tokens. What must not happen is the token being silently
# dropped: `401 with a valid token` is the failure mode to watch for.
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-mcp
  ports:
    - name: sse
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: harbor.drlinuxer.com/rag-chatbot/grafana-mcp:latest
          args:
            - --transport
            - sse
            - --address
            - 0.0.0.0:8000
            - --disable-write
            - --allowed-hosts
            - "*"
            - --log-level
            - info
          env:
            - name: GRAFANA_URL
              value: "http://10.10.10.18:3000"
            # The ONLY way this server receives a Grafana credential. Optional so the pod
            # still starts without it (healthz works, tool LISTING works) and the failure is
            # a visible 401 on a query rather than a crash loop.
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-credentials
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
                  optional: true
          ports:
            - name: sse
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
