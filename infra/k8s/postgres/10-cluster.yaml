# === rag-chatbot — PostgreSQL HA (CloudNativePG) =========================
# 3-instance primary/standby/standby streaming replication cluster with
# pgvector extension enabled at bootstrap. Storage class is TrueNAS iSCSI
# (project-managed); substitute with your storage class when replaying.
#
# Requires:
#   kubectl apply -f infra/k8s/postgres/00-secret-app.yaml
#   kubectl apply -f infra/k8s/postgres/01-secrets-replication.yaml
#   kubectl apply -f infra/k8s/postgres/02-pvc.yaml     # optional if dynamic provisioner
#   kubectl apply -f infra/k8s/postgres/10-cluster.yaml
#   kubectl apply -f infra/k8s/postgres/20-services.yaml
#   kubectl apply -f infra/k8s/postgres/30-pgadmin.yaml
#   kubectl apply -f infra/k8s/postgres/40-monitoring.yaml

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ha
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: postgres-ha
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: rag-chatbot
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # 3 replicas across nodes when possible (anti-affinity preferred so
  # dev/test clusters still schedule on a single node).
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  bootstrap:
    initdb:
      database: assistant
      owner: app
      encoding: UTF8
      localeCollate: C
      localeCType: C
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
      secret:
        name: postgres-app-secret   # initial app user / password

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "1GB"
      work_mem: "16MB"
      maintenance_work_mem: "512MB"
      archive_mode: "on"
      archive_timeout: "5min"
      wal_level: "replica"
      log_min_duration_statement: "500ms"
      log_checkpoints: "on"
      log_connections: "on"
      log_disconnections: "on"

  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

  storage:
    size: 30Gi
    storageClass: truenas-iscsi   # <-- replace with your StorageClass

  # Default `postgres` superuser — password access ENABLED (admin account
  # for managing databases/roles/replication). CNPG takes the password from
  # the SuperuserSecret `postgres-ha-superuser` (default name: <cluster>-superuser,
  # keys: username / password). If the secret is missing the operator creates
  # one with a generated password; when it exists, CNPG reconciles the secret's
  # content into the `postgres` role — but OBSERVED on this cluster (2026-10-22,
  # operator 1.30.0): a pre-existing secret did NOT get applied to the role and
  # TCP auth failed until the password was synced manually from the writer:
  #
  #   PW=$(kubectl -n rag-chatbot get secret postgres-ha-superuser \
  #          -o jsonpath='{.data.password}' | base64 -d)
  #   printf '%s' "$PW" | kubectl -n rag-chatbot exec -i postgres-ha-1 -c postgres \
  #     -- sh -c 'read PW; psql -U postgres -c "ALTER ROLE postgres PASSWORD '"'"'$PW'"'"'"'
  #
  # Verify after enabling/rotating (password flows through the env only):
  #   kubectl -n rag-chatbot exec postgres-ha-1 -c postgres -- env PGPASSWORD="$PW" \
  #     psql -U postgres -h 127.0.0.1 -tAc "SELECT current_user"
  #
  # Inside a pod, plain `psql -U postgres` (local socket, peer auth via
  # pg_ident map=local) needs no password; `-h 127.0.0.1` uses scram-sha-256.
  # When false, CNPG blanks the postgres password (NULL) and deletes the secret.
  enableSuperuserAccess: true

  # Managed pooled connection (PgBouncer) — 2 replicas fronting the writer.
  enablePools: true
  pools:
    - name: pooler
      instances: 2
      type: rw
      maxDBConnections: 60
      imageName: ghcr.io/cloudnative-pg/pgbouncer:1.22.1

  monitoring:
    enablePodMonitor: false
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries

  backup:
    retention: "7d"
    barmanObjectStore: null   # (no object storage configured — see /backup README)

  network:
    # PG listens on 5432 inside the cluster by default
