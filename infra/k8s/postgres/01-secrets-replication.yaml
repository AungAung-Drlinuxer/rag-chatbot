# === rag-chatbot — PostgreSQL replication + transport secrets =============
# cnpg-default-monitoring configmap and streaming-replication secret.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-ha-replication
  namespace: rag-chatbot
type: Opaque
stringData:
  # Replication user created by CNPG operator
  username: streaming_replica
  password: __REPLACE_WITH_RANDOM_32_BYTES__
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-ha-server
  namespace: rag-chatbot
  annotations:
    cnpg.io/operatorVersion: "1.24"
type: Opaque
stringData:
  # Server certificate chain (self-signed) used by the application to
  # verify TLS to the cluster. Generate with:
  #   cfssl gencert -initca ca-csr.json | cfssljson -bare ca
  ca.crt: __REPLACE_WITH_PEM__
  tls.crt: __REPLACE_WITH_PEM__
  tls.key: __REPLACE_WITH_PEM__
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-ha-ca
  namespace: rag-chatbot
type: Opaque
stringData:
  ca.crt: __REPLACE_WITH_PEM__
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-ha-pooler
  namespace: rag-chatbot
type: Opaque
stringData:
  username: pooler
  password: __REPLACE_WITH_RANDOM_32_BYTES__
