# === rag-chatbot — pgAdmin (admin web UI for the HA cluster) =============
# Internal-only — exposed via the same `chat.drlinuxer.com` ingress with a
# path prefix. NOT publicly reachable.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/component: database-tools
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin
    spec:
      securityContext:
        fsGroup: 5050
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:8.11
          imagePullPolicy: IfNotPresent
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@drlinuxer.local
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: password
            - name: PGADMIN_LISTEN_PORT
              value: "80"
            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers.json
            - name: GUNICORN_LIMIT_REQUEST_LINE
              value: "8190"
            - name: GUNICORN_THREADS
              value: "25"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",   memory: 512Mi }
          livenessProbe:
            httpGet: { path: /misc/ping, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /misc/ping, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin-pvc
        - name: servers
          configMap:
            name: pgadmin-servers
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-service
  namespace: rag-chatbot
spec:
  selector:
    app.kubernetes.io/name: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-pvc
  namespace: rag-chatbot
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: truenas-iscsi
---
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secret
  namespace: rag-chatbot
type: Opaque
stringData:
  password: __REPLACE_WITH_RANDOM_24_BYTES__
