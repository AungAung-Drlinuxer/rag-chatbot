# === rag-chatbot — CNPG monitoring configmap =============================
# Standard queries for CloudNativePG podmonitor (postgres_exporter sidecar).

apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-default-monitoring
  namespace: rag-chatbot
  labels:
    cnpg.io/monitoring: "true"
data:
  queries: |
    pg_replication_lag: "SELECT CASE WHEN NOT pg_is_in_recovery() THEN 0 ELSE EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))::INT END AS lag_seconds"
    pg_stat_replication: "SELECT pid, usename, application_name, client_addr, state, sync_state, write_lag, flush_lag, replay_lag FROM pg_stat_replication"
    pg_stat_activity: "SELECT datname, usename, application_name, state, count(*) FROM pg_stat_activity GROUP BY 1,2,3,4"
