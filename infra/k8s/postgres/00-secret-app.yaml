# === rag-chatbot — PostgreSQL application user (initial owner) ==========
# Created BEFORE the CNPG Cluster so it can be referenced via
# bootstrap.initdb.secret.name. Replace `password` with the value from
# sealed-secrets / Vault in production.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-app-secret
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: postgres-ha
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # username:password base64 — `app` is the database owner used by `bootstrap.initdb.owner`
  username: app
  password: __REPLACE_WITH_REAL_PASSWORD__
