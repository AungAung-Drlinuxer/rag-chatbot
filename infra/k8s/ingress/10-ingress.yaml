# === it-help-chatbot — Ingress (nginx-ingress + cert-manager) ================
# Public hostname: chat.drlinuxer.com
# TLS: wildcard certificate `drlinuxer-tls` already issued in-cluster.
# Path routing:
#   /api/*    -> backend:8000
#   /pgadmin  -> pgadmin-service:80
#   /redis    -> redisinsight-service:80
#   /         -> frontend:80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: it-help-chatbot
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "drlinuxer-issuer"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [chat.drlinuxer.com]
      secretName: drlinuxer-tls
  rules:
    - host: chat.drlinuxer.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /pgadmin
            pathType: Prefix
            backend:
              service:
                name: pgadmin-service
                port:
                  number: 80
          - path: /redis
            pathType: Prefix
            backend:
              service:
                name: redisinsight-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: it-help-chatbot
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.drlinuxer.com]
      secretName: drlinuxer-tls
  rules:
    - host: api.drlinuxer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
