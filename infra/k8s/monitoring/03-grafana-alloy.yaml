apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: alloy
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // =========================================================================
    // GRAFANA ALLOY — SINGLE-INSTANCE COLLECTOR (Deployment, replicas=1)
    //
    // IMPORTANT: metrics + logs are collected by exactly ONE pod. Multiple
    // replicas scraping identical targets produce duplicate samples with
    // conflicting timestamps, which Prometheus remote_write rejects
    // ("out of order sample") — leaving dashboards empty.
    //
    // TRACES : OTLP (4318/4317) -> Tempo + service graph/span metrics -> Prom
    // METRICS: KSM / cAdvisor / node-exporter / rag-chatbot backend -> Prometheus
    // =========================================================================

    // ------------------------- 1. TRACES PIPELINE ---------------------------
    // Receives OTLP traces from rag-chatbot backend, forwards them to Tempo,
    // AND generates service graph + span metrics (RED) into Prometheus so the
    // Tempo "Service Graph" tab in Grafana has data.
    otelcol.receiver.otlp "traces" {
      http {
        endpoint = "0.0.0.0:4318"
      }
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      output {
        traces = [
          otelcol.connector.servicegraph.default.input,
          otelcol.connector.spanmetrics.default.input,
          otelcol.exporter.otlphttp.tempo.input,
        ]
      }
    }

    // Service graph metrics: edges between services (rate/error/duration)
    otelcol.connector.servicegraph "default" {
      dimensions     = ["namespace", "k8s.namespace.name", "k8s.pod.name"]
      output {
        metrics = [otelcol.exporter.prometheus.servicegraph.input]
      }
    }

    // Span metrics: RED metrics per span (rate/error/duration table)
    otelcol.connector.spanmetrics "default" {
      dimension {
        name = "k8s.namespace.name"
      }
      histogram {
        unit = "s"
        explicit {
          buckets = ["2ms", "10ms", "50ms", "100ms", "200ms", "500ms", "1s", "2s", "5s", "10s", "30s"]
        }
      }
      output {
        metrics = [otelcol.exporter.prometheus.spanmetrics.input]
      }
    }

    // Forward raw traces to Tempo (external VM, OTLP HTTP on 4318)
    otelcol.exporter.otlphttp "tempo" {
      client {
        endpoint = "http://10.10.10.18:4318"
      }
    }

    // Expose generated metrics on a prometheus-scrapable endpoint
    otelcol.exporter.prometheus "servicegraph" {
      resource_to_telemetry_conversion = true
      forward_to = [prometheus.remote_write.external_prom.receiver]
    }

    otelcol.exporter.prometheus "spanmetrics" {
      resource_to_telemetry_conversion = true
      forward_to = [prometheus.remote_write.external_prom.receiver]
    }

    // ------------------------ 2. METRICS PIPELINE ---------------------------
    prometheus.remote_write "external_prom" {
      endpoint {
        url = "http://10.10.10.18:9090/api/v1/write"
      }
    }

    // A. Kube-State-Metrics (pod/deployment/node state — up/down visibility)
    prometheus.scrape "kube_state_metrics" {
      targets = [{
        __address__ = "kube-state-metrics.monitoring.svc.cluster.local:8080",
      }]
      forward_to      = [prometheus.remote_write.external_prom.receiver]
      scrape_interval = "15s"
    }

    // B. cAdvisor (container CPU / memory / network)
    discovery.kubernetes "nodes" {
      role = "node"
    }

    prometheus.scrape "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      scheme  = "https"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      metrics_path      = "/metrics/cadvisor"
      forward_to        = [prometheus.remote_write.external_prom.receiver]
      scrape_interval   = "15s"
    }

    // C. Node Exporter (host CPU / RAM / disk)
    discovery.kubernetes "node_exporter_pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "metadata.namespace=monitoring"
        label = "app.kubernetes.io/name=node-exporter"
      }
    }

    prometheus.scrape "node_exporter" {
      targets         = discovery.kubernetes.node_exporter_pods.targets
      forward_to      = [prometheus.remote_write.external_prom.receiver]
      scrape_interval = "15s"
    }

    // D. rag-chatbot backend application metrics (LLM/RAG)
    discovery.kubernetes "backend_pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "metadata.namespace=rag-chatbot"
        label = "app.kubernetes.io/name=backend"
      }
    }

    prometheus.scrape "chatbot_backend" {
      targets         = discovery.kubernetes.backend_pods.targets
      metrics_path    = "/metrics"
      forward_to      = [prometheus.remote_write.external_prom.receiver]
      scrape_interval = "10s"
    }

    // E. Alloy self-metrics (pipeline health)
    prometheus.scrape "self" {
      targets = [{"__address__" = "127.0.0.1:12345"}]
      forward_to      = [prometheus.remote_write.external_prom.receiver]
      scrape_interval = "15s"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
spec:
  replicas: 1            # MUST stay 1 — see header comment
  strategy:
    type: Recreate       # avoid two collectors overlapping during rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      # Pin to the first master so /var/log/pods covers master-hosted pods;
      # worker pod logs are still covered because ALL pods write to /var/log/pods
      # on their own node — a single-node agent would miss them. Therefore run as
      # a Deployment on a node and ALSO keep node coverage via multi-writer safe
      # pattern: ONLY this single replica ships metrics; logs follow the same
      # rule (single writer, no duplicates).
      containers:
      - name: alloy
        image: grafana/alloy:v1.0.0
        args:
        - "run"
        - "/etc/alloy/config.alloy"
        - "--storage.path=/var/lib/alloy/data"
        - "--server.http.listen-addr=0.0.0.0:12345"
        ports:
        - name: http-metrics
          containerPort: 12345
        - name: otlp-http
          containerPort: 4318
        - name: otlp-grpc
          containerPort: 4317
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: data
          mountPath: /var/lib/alloy/data
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits:   { cpu: "2",  memory: 2Gi }
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: data
        emptyDir: {}
---
# OTLP receiver service — rag-chatbot backend sends traces here
apiVersion: v1
kind: Service
metadata:
  name: alloy-otlp
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
# LOGS-ONLY collector: one pod per node ships /var/log/pods to Loki.
# Metrics are deliberately NOT scraped here (single Deployment above owns all
# metrics to avoid duplicate-sample "out of order" rejections).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: monitoring
data:
  config.alloy: |
    local.file_match "pod_logs" {
      path_targets = [{
        __path__ = "/var/log/pods/*/*/*.log",
      }]
    }

    loki.source.file "pod_logs_scraper" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.add_labels.receiver]
    }

    loki.process "add_labels" {
      stage.cri {}
      stage.regex {
        expression = `^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*\.log$`
        source     = "filename"
      }
      stage.labels {
        values = {
          namespace = "",
          pod       = "",
          container = "",
        }
      }
      forward_to = [loki.write.endpoint.receiver]
    }

    loki.write "endpoint" {
      endpoint {
        url = "http://10.10.10.18:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-logs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy-logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-logs
    spec:
      serviceAccountName: alloy
      containers:
      - name: alloy
        image: grafana/alloy:v1.0.0
        args:
        - "run"
        - "/etc/alloy/config.alloy"
        - "--storage.path=/var/lib/alloy/data"
        - "--server.http.listen-addr=0.0.0.0:12345"
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: data
          mountPath: /var/lib/alloy/data
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      volumes:
      - name: config
        configMap:
          name: alloy-logs-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: data
        emptyDir: {}
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
