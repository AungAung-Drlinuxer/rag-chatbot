# === it-help-chatbot — Redis Sentinel =========================================
# 3 sentinels form a Raft group, automatically elect a master after failover.
# Application connects via `redis-service` ClusterIP which the backend
# python-redis client resolves through sentinel topology discovery.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: it-help-chatbot
spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: sentinel
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redis
                    app.kubernetes.io/component: sentinel
      containers:
        - name: sentinel
          image: redis:7.4
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /conf/sentinel.conf
            - --sentinel
          ports:
            - name: sentinel
              containerPort: 26379
          volumeMounts:
            - { name: conf, mountPath: /conf }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          livenessProbe:
            exec:
              command: ["redis-cli","-p","26379","ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: conf
          configMap:
            name: redis-config
            items: [{ key: sentinel.conf, path: sentinel.conf }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  namespace: it-help-chatbot
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-service
  namespace: it-help-chatbot
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: it-help-chatbot
  spec:
  # Empty selector + sentinel-managed proxy discovery (sentinel-aware client).
  # Python redis://...&sentinel=it-help-redis discovers the master at runtime.
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: data
  ports:
    - name: client
      port: 6379
      targetPort: 6379
