# === rag-chatbot — Frontend (Vite/React, served by nginx) ===============
# Source: harbor.drlinuxer.com/rag-chatbot/frontend   (project is 'rag-chatbot' —
# the old 'ragchatbot' path does not exist in Harbor and would fail to pull)
# Static SPA — pure nginx, no API in the pod. All `/api/*` calls are reverse
# proxied to the backend service in-cluster.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: harbor.drlinuxer.com/rag-chatbot/frontend:1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # NOTE: nginx.conf hardcodes `proxy_pass http://backend:80` and resolves that
          # name AT STARTUP, so this pod cannot start unless the `backend` Service already
          # exists in this namespace. BACKEND_UPSTREAM below is NOT read by nginx.conf —
          # it is documentation of the target, not configuration. Keep the two in sync or
          # the env var will describe a proxy that is not in effect.
          env:
            # Vite build-time env (VITE_*) is baked into the bundle; runtime
            # only configures nginx behaviour.
            - { name: BACKEND_UPSTREAM, value: "http://backend.rag-chatbot.svc.cluster.local:8000" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rag-chatbot
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
