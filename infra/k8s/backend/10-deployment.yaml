# === rag-chatbot — Backend (FastAPI / modular app/) =====================
# Source: harbor.drlinuxer.com/ragchatbot/backend
# Reads config from env (live override) and `system_settings` (DB) for
# integrations. Connects to:
#   postgres-ha-rw.rag-chatbot.svc.cluster.local:5432
#   redis-service.rag-chatbot.svc.cluster.local:6379
#   ollama.rag-chatbot.svc.cluster.local:11434
#   embedding-service.rag-chatbot.svc.cluster.local:8080
#   rerank-svc.rag-chatbot.svc.cluster.local:8080

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rag-chatbot
data:
  # Non-secret runtime config
  APP_ENV: "prod"
  LOG_LEVEL: "info"
  RAGCHAT_NAMESPACE: "rag-chatbot"
  ALLOWED_DOMAINS: "chat.drlinuxer.com"
  CONFLUENCE_BASE_URL: "https://drlinuxer.atlassian.net/wiki"
  CONFLUENCE_EMAIL: "ops@drlinuxer.com"
  # Default LLM (overridable from Settings UI)
  HCHAT_PROVIDER: "openai"
  HCHAT_BASE_URL: "https://openrouter.ai/api/v1"
  HCHAT_MODEL: "minimax/minimax-m3:free"
  HCHAT_API_KEY: ""   # MUST be set in DB system_settings (Settings -> Integrations)
  LLM_MAX_TOKENS: "1024"
  FALLBACK_LLM_MODEL: "llama3.2:1b"
  # Retrieval
  RAG_TOP_K: "5"
  RAG_FETCH_K: "32"
  RERANK_ENABLED: "true"
  HYBRID_ENABLED: "true"
  SIMILARITY_THRESHOLD: "0.55"
  # LangGraph bounds
  LANGGRAPH_ENABLED: "1"
  # OAuth / LDAP
  LDAP_ENABLED: "false"
  LDAP_URL: ""
  LDAP_BASE_DN: ""
  LDAP_BIND_DN: ""
  LDAP_USER_FILTER: "(sAMAccountName={username})"
  RBAC_ADMIN_GROUPS: "cn=it-help-admins,ou=groups,dc=drlinuxer,dc=local"
  RBAC_AGENT_GROUPS: "it-help-agents"
  # Observability
  TEMPO_OTLP_URL: ""
  MIMIR_OTLP_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: rag-chatbot
type: Opaque
stringData:
  # DB connection — used by the application AND by the in-cluster admin tools.
  DATABASE_URL: "postgresql+psycopg2://app:__DB_PASSWORD__@postgres-ha-rw.rag-chatbot.svc.cluster.local:5432/assistant"
  # Redis
  REDIS_URL: "redis://app:__REDIS_PASSWORD__@redis-service.rag-chatbot.svc.cluster.local:6379/0"
  # Auth
  JWT_SECRET: "__REPLACE_WITH_RANDOM_64_BYTES__"
  # Service-to-service auth between backend and rerank/embedding
  RERANK_API_KEY: "__REPLACE_WITH_RANDOM_32_BYTES__"
  EMBED_API_KEY:  "__REPLACE_WITH_RANDOM_32_BYTES__"
  # Backdoor (development only — REMOVE in hardened production)
  DEV_PASSWORD: "__DEV_BACKDOOR_PASSWORD__"
  # SMTP (used by /api/notify for escalations + approval emails)
  SMTP_HOST: "smtp.drlinuxer.local"
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: "no-reply@drlinuxer.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: rag-chatbot-backend
      automountServiceAccountToken: true
      containers:
        - name: backend
          image: harbor.drlinuxer.com/ragchatbot/backend:0.0.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef:    { name: backend-secrets }
          env:
            - { name: PORT,        value: "8000" }
            - { name: UVICORN_WORKERS, value: "2" }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: "2",  memory: 4Gi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rag-chatbot
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: it-help-api
  namespace: rag-chatbot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
