# Domain classifier vocabulary (GOVERNANCE Rule 5: configuration is externalized).
# Stage 1 fast keyword rules: substring match on the lowercased query.
# Weighted domains get their hit count multiplied before the argmax.
# SECURITY_TERMS is kept for compatibility but weighting is expressed via `weights`.

stage1_confidence: 0.7        # below this, the pipeline trusts the top retrieved doc's domain
lockdown_domain: general      # fallback domain when nothing matches
base_confidence: 0.75         # confidence for a single hit
per_extra_hit: 0.1            # confidence gained per additional hit
max_confidence: 0.98

weights:
  security: 2.0
  kubernetes: 1.5
  storage: 1.5
  application: 1.5

domains:
