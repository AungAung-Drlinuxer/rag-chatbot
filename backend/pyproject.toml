[project]
name = "it-help-chatbot-backend"
version = "0.18.4"
description = "IT Help Chatbot — LangChain RAG (Phase 1 MVP) — FastAPI + PGVector + Ollama embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-multipart",
  "celery[redis]>=5.6.3",
  "fastapi>=0.141.1",
  "langchain>=1.3.17",
  "langgraph>=0.2",
  "langchain-anthropic>=1.6.1",
  "langchain-community>=0.4.2",
  "langchain-core>=1.6.0",
  "langchain-ollama>=1.1.0",
  "langchain-openai>=1.6.0",
  "ldap3>=2.9.1",
  "sentence-transformers>=5.2.0",
  "opentelemetry-api>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "opentelemetry-sdk>=1.44.0",
  "pgvector>=0.5.0",
  "psycopg2-binary>=2.9.12",
  "pydantic-settings>=2.15.0",
  "python-jose[cryptography]>=3.5.0",
  "pyyaml>=6.0",
  "redis>=6.4.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.52.4",
  "langgraph-checkpoint-postgres>=3.1.2",
  "psycopg[binary]>=3.3.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: needs live Ollama/PG"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# BLE001: intentional fail-safe / fail-open error handling across the app (broad
#         `except Exception` is deliberate so RAG/persistence/telemetry never breaks a stream).
ignore = ["BLE001"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
