# Static SPA + same-origin /api proxy to the backend service (SSE-aware).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE -> backend Service (ClusterIP, port 8000)
    #
    # The port MUST match the Service's `port`, not the container's. It was `backend:80`
    # since the file was written, which never worked: the Service publishes 8000, so nginx
    # could not resolve an upstream and every same-origin /api/ call returned 504. The old
    # comment claimed "port 80 -> 8000", which is where the mistake came from — the Service
    # is 8000 and `targetPort: http` does the container-side mapping.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_buffering off;                 # SSE must not be buffered
        proxy_cache off;
        proxy_read_timeout 600s;             # long-lived LLM stream
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering no;
    }
}
