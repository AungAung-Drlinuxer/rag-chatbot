# Static SPA + same-origin /api proxy to the backend service (SSE-aware).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE -> backend Service (ClusterIP, port 80 -> 8000)
    location /api/ {
        proxy_pass http://backend:80;
        proxy_buffering off;                 # SSE must not be buffered
        proxy_cache off;
        proxy_read_timeout 600s;             # long-lived LLM stream
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering no;
    }
}
