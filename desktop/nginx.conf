# Static SPA + same-origin /api proxy to the backend service (SSE-aware).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The HTML shell is the one file whose URL never changes but whose CONTENT changes on
    # every release. Without an explicit directive browsers fall back to heuristic caching
    # (a fraction of the file's age), so a client keeps booting the previous build out of its
    # own cache for hours after a deploy: the page renders, the API answers, and the UI
    # silently stays old. `no-cache` means "revalidate before use", not "do not store" — the
    # ETag makes that a cheap 304, and a new release is picked up on the very next load.
    #
    # Inherited by `location /`, which serves the shell and every client-side route.
    # `location /api/` and `location /assets/` define their own add_header, so neither
    # inherits it (API responses stay uncached, as before).
    add_header Cache-Control "no-cache" always;

    # Hashed build output (the filename carries a hash of the bytes). A given URL can never
    # change meaning, so the only thing that matters here is that a URL which does NOT exist
    # must never be answered with something that does.
    location /assets/ {
        # 404 rather than falling through to index.html. The SPA fallback below answers a
        # missing chunk with the HTML shell and status 200, and the edge caches whatever comes
        # back under the URL that was requested — so a client asking for a chunk from a
        # previous release receives HTML where it expects JavaScript and stays broken until
        # that cache entry expires. A 404 is unambiguous and cannot poison the URL.
        #
        # No Cache-Control here on purpose: the ingress already sets the asset TTL (~22h),
        # and a second, conflicting max-age would be ambiguous.
        try_files $uri =404;
    }

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE -> backend Service (ClusterIP, port 8000)
    #
    # The port MUST match the Service's `port`, not the container's. It was `backend:80`
    # since the file was written, which never worked: the Service publishes 8000, so nginx
    # could not resolve an upstream and every same-origin /api/ call returned 504. The old
    # comment claimed "port 80 -> 8000", which is where the mistake came from — the Service
    # is 8000 and `targetPort: http` does the container-side mapping.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_buffering off;                 # SSE must not be buffered
        proxy_cache off;
        proxy_read_timeout 600s;             # long-lived LLM stream
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering no;
    }
}
